name: 打包 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 取出签名钥匙（第一次打包时自动生成，之后一直用同一把）
        uses: actions/cache@v4
        with:
          path: ~/.jhxt-signing
          key: jhxt-signing-v1

      - name: 准备签名钥匙
        run: |
          mkdir -p ~/.jhxt-signing
          if [ ! -f ~/.jhxt-signing/jinhua.keystore ]; then
            openssl rand -hex 16 > ~/.jhxt-signing/pass
            keytool -genkeypair -keystore ~/.jhxt-signing/jinhua.keystore -storepass "$(cat ~/.jhxt-signing/pass)" -keypass "$(cat ~/.jhxt-signing/pass)" -alias jinhua -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Jinhua Xitong"
          fi
          echo "::add-mask::$(cat ~/.jhxt-signing/pass)"
          echo "JHXT_KEYSTORE=$HOME/.jhxt-signing/jinhua.keystore" >> $GITHUB_ENV
          echo "JHXT_KEYSTORE_PASS=$(cat ~/.jhxt-signing/pass)" >> $GITHUB_ENV

      - name: 下载手写字体（Long Cang，OFL 授权）
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL -o app/src/main/res/font/long_cang.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/longcang/LongCang-Regular.ttf

      - name: 打包
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: 发布到 Releases（手机打开链接就能下载）
        if: success()
        run: |
          cp app/build/outputs/apk/release/app-release.apk jinhua-xitong.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest jinhua-xitong.apk --title "进化系统 第 ${GITHUB_RUN_NUMBER} 版" --notes "用手机下载 jinhua-xitong.apk 安装。" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 把结果和日志放到 build-log 分支
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          tail -n 400 build.log > /tmp/build-tail.log || echo "no log" > /tmp/build-tail.log
          git checkout --orphan build-log
          git rm -rf . > /dev/null
          cp /tmp/build-tail.log build.log
          echo "run ${GITHUB_RUN_NUMBER} ${GITHUB_SHA} status=${{ job.status }}" > run.txt
          git add build.log run.txt
          git commit -m "build log ${GITHUB_RUN_NUMBER}"
          git push -f origin build-log
